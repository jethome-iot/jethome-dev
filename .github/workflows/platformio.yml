# PlatformIO Docker Build Workflow
#
# Build Strategy:
# - Main repo master: Build + Push to GHCR
# - Main repo dev/PR: Build only (validation)
# - workflow_dispatch: Build on any branch of the main repo, push only on master
# - Forks: nothing runs - the runner pools are not reachable there; use
#   ./scripts/build.sh instead
# - Multi-platform: Platform matrix builds linux/amd64 and linux/arm64 in parallel,
#   each on a runner of its own architecture (matrix.runner) - no QEMU
name: 🐳 PlatformIO Docker Image

on:
  push:
    branches: [master, dev]
    paths:
      - '.github/workflows/platformio.yml'
      - 'images/platformio/**'
  pull_request:
    branches: [master, dev]
    paths:
      - '.github/workflows/platformio.yml'
      - 'images/platformio/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORMIO_IMAGE_NAME: jethome-dev-platformio

jobs:
  platformio-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Owner-only, with no workflow_dispatch escape hatch: the runner pools belong
    # to jethome-iot, a fork cannot resolve their labels, and an unresolvable
    # `runs-on` queues for 24 hours rather than failing. A fork that wants to build
    # this image runs ./scripts/build.sh.
    if: github.repository_owner == 'jethome-iot'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ['v6.1.18']
        platform: ['linux/amd64', 'linux/arm64']
        include:
          - version: 'v6.1.18'
            pio_version: 'v6.1.18'
          # Each platform builds on its own architecture; the arm64 leg was QEMU
          # before this. A platform value with no entry here leaves runs-on empty
          # and the leg never starts - actionlint does not catch that.
          - platform: 'linux/amd64'
            runner: 'ubuntu-latest-8core'
          - platform: 'linux/arm64'
            runner: 'ubuntu-latest-8core-arm'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        if: github.ref_name == 'master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🏷️ Generate tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "platform_tag=${PLATFORM_TAG}" >> "$GITHUB_OUTPUT"
          
      - name: 🐳 Build and push platform-specific image
        uses: docker/build-push-action@v7
        with:
          context: images/platformio
          platforms: ${{ matrix.platform }}
          push: ${{ github.ref_name == 'master' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}:pio-${{ matrix.version }}-${{ steps.tags.outputs.platform_tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}:sha-${{ steps.tags.outputs.sha_short }}-${{ steps.tags.outputs.platform_tag }}
          build-args: |
            PIO_VERSION=${{ matrix.pio_version }}

  platformio-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: platformio-build
    if: github.repository_owner == 'jethome-iot' && github.ref_name == 'master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ['v6.1.18']
        include:
          - version: 'v6.1.18'
            pio_version: 'v6.1.18'
    steps:
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🏷️ Generate tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
      
      - name: 🐳 Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}:sha-${{ steps.tags.outputs.sha_short }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}:pio-${{ matrix.version }} \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}:pio-${{ matrix.version }}-linux-amd64 \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}:pio-${{ matrix.version }}-linux-arm64
