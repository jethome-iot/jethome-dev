# PlatformIO Docker Build Workflow
#
# Build Strategy:
# - Main repo master: Build + Push to GHCR
# - Main repo dev/PR: Build only (validation) - nothing is uploaded. Unlike
#   esp-idf.yml, no other job consumes this image, so there is nothing to push for.
# - workflow_dispatch: Build on any branch of the main repo, push only on master
# - Forks: nothing runs - the runner pools are not reachable there; use
#   ./scripts/build.sh instead
# - Multi-platform: Platform matrix builds linux/amd64 and linux/arm64 in parallel,
#   each on a runner of its own architecture (matrix.runner) - no QEMU
name: 🐳 PlatformIO Docker Image

on:
  push:
    branches: [master, dev]
    # Negations come last and are order-sensitive; `paths:` and `paths-ignore:`
    # cannot both be used for one event. Documentation-only commits used to
    # trigger a full rebuild and republish every tag - the docs-only merge that
    # started this series set off a 5.5-hour ESP-Matter leg.
    paths:
      - '.github/workflows/platformio.yml'
      - 'images/platformio/**'
      - 'images/versions.json'
      - 'scripts/versions-matrix.sh'
      - 'scripts/check-versions.sh'
      - '!images/**/*.md'
  pull_request:
    branches: [master, dev]
    paths:
      - '.github/workflows/platformio.yml'
      - 'images/platformio/**'
      - 'images/versions.json'
      - 'scripts/versions-matrix.sh'
      - 'scripts/check-versions.sh'
      - '!images/**/*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORMIO_IMAGE_NAME: jethome-dev-platformio
  # build-push-action v6+ uploads a build record as a workflow artifact by default.
  # This repository is public, so that archive - full build log and metadata - would
  # be downloadable by anyone off the run page, on every leg of every push. The
  # summary itself is kept: it reports what was built without opening the log, and
  # costs no storage.
  DOCKER_BUILD_RECORD_UPLOAD: false

# Superseded pull-request runs are cancelled - nothing has been published yet and
# they cost money. Pushes are deliberately NOT grouped together: the group key
# includes the commit, so each one gets its own group and none can cancel another.
#
# `cancel-in-progress: false` would not have given a queue. GitHub cancels a
# *pending* run in a group whenever a newer one arrives, regardless of that flag -
# so grouping master pushes by ref would silently drop the middle commit of any
# three that land inside one build window, and its sha-<short-commit> image, which the
# READMEs document as the way to pin an exact commit, would never exist.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Both matrices come from images/versions.json, so a version lives in one place
  # instead of two matrix blocks that have to be edited together. The consistency
  # check runs first and fails the whole workflow.
  prepare:
    name: 🧮 Resolve matrices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'jethome-iot' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    outputs:
      build: ${{ steps.matrices.outputs.build }}
      manifest: ${{ steps.matrices.outputs.manifest }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ✅ Check version consistency
        run: ./scripts/check-versions.sh

      - name: 🧮 Generate matrices
        id: matrices
        run: |
          set -euo pipefail
          # Assigned first, echoed second: `echo "k=$(cmd)"` takes echo's exit
          # status, so a failing generator would write an empty matrix and leave
          # this step green.
          build=$(./scripts/versions-matrix.sh platformio build)
          manifest=$(./scripts/versions-matrix.sh platformio manifest)
          {
            echo "build=${build}"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"

  platformio-build:
    name: platformio-build (${{ matrix.tag }}, ${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # Owner-only, with no workflow_dispatch escape hatch: the runner pools belong
    # to jethome-iot, a fork cannot resolve their labels, and an unresolvable
    # `runs-on` queues for 24 hours rather than failing. A fork that wants to build
    # this image runs ./scripts/build.sh.
    # Two conditions, not one. The owner check keeps this out of forks that run the
    # workflow themselves. The head-repo check keeps it out of pull requests *from*
    # a fork, where github.repository_owner is still jethome-iot - so without it a
    # fork-controlled Dockerfile would execute on this org's paid runner pools.
    if: github.repository_owner == 'jethome-iot' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        if: github.ref_name == 'master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Pushed by digest, with no tag of its own: a tag here would be a mutable
      # name that the manifest job below has to look up again later, and between
      # those two moments another run can overwrite it. The digest is the only
      # thing handed forward.
      - name: 🐳 Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/platformio
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_name == 'master' }}
          build-args: ${{ matrix.build_args }}
          # Pinned rather than left to the action's default, which differs between
          # public and private repositories and has changed across majors. mode=max
          # records build-args and the event payload into a public attestation - see
          # CLAUDE.md before adding an ARG that carries anything sensitive.
          provenance: mode=max

      # Matrix legs cannot each set a job output - they would overwrite one
      # another - so the digests travel as one empty file per leg, named after the
      # digest itself.
      - name: 📤 Export digest
        if: github.ref_name == 'master'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: ⬆️ Upload digest
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORMIO_IMAGE_NAME }}-${{ matrix.tag }}-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  platformio-manifest:
    name: platformio-manifest (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, platformio-build]
    # See the note in esp-idf.yml: one variant's failure must not withhold another
    # variant's tags.
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && github.repository_owner == 'jethome-iot'
      && github.ref_name == 'master' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.manifest) }}
    steps:
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ env.PLATFORMIO_IMAGE_NAME }}-${{ matrix.tag }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: 🐳 Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}
          TAG: ${{ matrix.tag }}
          PRIMARY: ${{ matrix.primary }}
          EXPECTED_PLATFORMS: ${{ matrix.platform_count }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          found=$(find . -type f | wc -l | tr -d ' ')
          if [ "${found}" -ne "${EXPECTED_PLATFORMS}" ]; then
            echo "::error::expected ${EXPECTED_PLATFORMS} platform digests, found ${found}"
            exit 1
          fi
          # Every source is a digest this run produced, so nothing here can be
          # resolved to another run's image. Built as an array rather than an
          # unquoted expansion so the refs survive as separate arguments without
          # relying on word splitting.
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done

          SHA_SHORT="${GITHUB_SHA:0:7}"
          # The revision name: this attempt of this run. `run_id` is unique per
          # GitHub instance and shared by every leg of the matrix; `run_attempt`
          # is what distinguishes a re-run, which nothing else here does - the
          # commit is the same and, with no build cache, the image is not.
          STAMP="r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          # What the new index will contain: imagetools copies the CHILDREN of
          # each leg, not the leg index itself, so that is what an existing tag
          # has to be compared against. Comparing index digests instead would
          # compare something that also depends on the order of the sources and
          # on annotations, neither of which says anything about the contents.
          #
          # Accumulated in a loop rather than piped into `sort -u`: a `for` loop
          # that is not the last element of a pipeline runs with its exit status
          # ignored, so `set -e` and `pipefail` both stop applying inside it and a
          # failed inspect would silently truncate the set. esp-idf.yml:255 already
          # carries that lesson ("jq exits 0 on empty input") - this is the same
          # trap wearing a loop.
          new_children=""
          for digest in *; do
            leg=$(docker buildx imagetools inspect --raw "${IMAGE}@sha256:${digest}") \
              || { echo "::error::cannot read the leg ${digest} this run just built"; exit 1; }
            kids=$(printf '%s' "${leg}" | jq -r '.manifests[]?.digest')
            [ -n "${kids}" ] || { echo "::error::leg ${digest} reports no children"; exit 1; }
            new_children="${new_children}${kids}"$'\n'
          done
          new_children=$(printf '%s' "${new_children}" | sort -u)

          # Write-once guard. It resolves the immutable names only - `latest` and
          # the version tag are meant to move - and it decides for the GROUP, not
          # per name.
          #
          # Per name was wrong, and the way it fails is worth spelling out:
          # `imagetools create` writes its tags as sequential PUTs and stops at the
          # first error, so a partial failure can leave `sha-<7hex>` written and
          # `<tag>-sha-<7hex>` not. A per-name guard then freezes the one that
          # exists and publishes the one that does not - leaving two immutable
          # names of one commit pointing at different images, with a green run.
          # Before this guard existed, a re-run simply rewrote both, consistently.
          immutable=("${TAG}-sha-${SHA_SHORT}")
          if [ "${PRIMARY}" = "true" ]; then
            immutable+=("sha-${SHA_SHORT}")
          fi

          free=0
          same=0
          differ=0
          differ_children=""
          for name in "${immutable[@]}"; do
            probe_err=$(mktemp)
            if raw=$(docker buildx imagetools inspect --raw "${IMAGE}:${name}" 2>"${probe_err}"); then
              existing=$(printf '%s' "${raw}" | jq -r '.manifests[]?.digest' | sort -u)
              if [ "${existing}" = "${new_children}" ]; then
                same=$((same + 1))
              else
                differ=$((differ + 1))
                # An empty child set means the name resolves to something that is
                # not an index at all. Recorded as its own literal rather than as
                # an empty string: empty lines vanish from the distinct count
                # below, and a name that vanishes agrees with everything.
                # Flattened to one line per name, because the accumulator is read
                # line by line below. An empty child set - a name resolving to
                # something that is not an index - is recorded as a literal rather
                # than as nothing: an empty line drops out of the distinct count,
                # and a name that drops out agrees with everything.
                kids_flat="${existing//$'\n'/,}"
                differ_children="${differ_children}${name}=${kids_flat:-(not-an-index)}"$'\n'
              fi
            # Anchored, not a substring search. buildx prints `ERROR: <ref>: not
            # found` for a missing tag - verified against ghcr.io - while `not
            # found` on its own also appears in "executable file not found in
            # \$PATH" from a broken credential helper and in a proxy's "404 page
            # not found" body. Either would be read as "the name is free", and the
            # guard would then overwrite an immutable name. A missing *package*
            # does not even say "not found": ghcr.io answers 403.
            elif grep -qE ': not found$|MANIFEST_UNKNOWN' "${probe_err}"; then
              free=$((free + 1))
            elif grep -qE '\b403 Forbidden\b' "${probe_err}"; then
              # A package that does not exist yet answers 403, not 404 - anonymous
              # pull cannot be authorized for a repository with no versions. The
              # first publication of any image lands here, so failing would mean
              # this guard makes a new image unpublishable: no `latest`, no version
              # tag, nothing. Treated as free, which is also what this job did
              # before the guard existed. A 403 that really is a permissions
              # problem still fails, loudly, on the create below.
              #
              # Matched on the status itself, never on the wrapper around it:
              # `failed to authorize` also prefixes a transient `503 Service
              # Unavailable` from the token service, and reading THAT as free
              # would overwrite existing commit tags as soon as the service
              # recovered before the create.
              echo "${name}: registry answers 403 - the package does not exist yet, or this token cannot read it; treating the name as free"
              free=$((free + 1))
            else
              echo "::error::cannot tell whether ${name} exists: $(cat "${probe_err}")"
              rm -f "${probe_err}"
              exit 1
            fi
            rm -f "${probe_err}"
          done

          total="${#immutable[@]}"
          skip_immutable=false
          # Counting the names that differ is not enough: they can differ from this
          # run AND from each other, which is what a create that failed part-way
          # through a rewrite leaves behind. Treating that as "consistently held by
          # an earlier build" would freeze exactly the split state this guard is
          # here to prevent.
          # `grep -c ''` counts every line, `grep -c .` skips empty ones - and an
          # empty line is exactly what a name with no children would contribute,
          # making a split state look like agreement.
          differ_distinct=$(printf '%s' "${differ_children}" | sed 's/^[^=]*=//' | sort -u | grep -c '' || true)
          if [ "${differ}" -eq "${total}" ] && [ "${differ_distinct}" -le 1 ]; then
            # Every immutable name is held by an earlier build of this commit, all
            # of them consistently. That is the ordinary rebuild: keep what is
            # published rather than moving names that promise not to move. The cost
            # - the sha names describe the earlier build, while `latest` and the
            # version tag describe this one - is stated here rather than hidden.
            skip_immutable=true
            echo "::warning::${TAG}-sha-${SHA_SHORT} and friends already name an earlier build of ${SHA_SHORT}; they stay put"
            printf '%s' "${differ_children}" | sed 's/^/  /'
          elif [ "${free}" -eq "${total}" ] || [ "${same}" -eq "${total}" ]; then
            : # nothing published yet, or an identical re-push: write them
          else
            # Mixed: some written, some not, or holding different images. That is
            # already an inconsistent registry - almost always a `imagetools create`
            # that failed part-way - so there is nothing worth preserving. Rewrite
            # them all, which is what this job did before the guard existed.
            echo "::warning::the immutable names of ${SHA_SHORT} do not agree (${free} free, ${same} identical, ${differ} different across ${differ_distinct} distinct builds) - republishing all of them"
          fi

          # Only the primary variant moves `latest` and the bare `sha-<short-commit>`.
          # Every variant gets `<version>-sha-<short-commit>` and the revision name.
          # The version tag is passed LAST: GHCR shows the last one as the package's
          # primary tag.
          names=()
          if [ "${PRIMARY}" = "true" ]; then
            names+=("latest" "sha-${SHA_SHORT}")
          fi
          names+=("${TAG}-sha-${SHA_SHORT}" "${TAG}-${STAMP}" "${TAG}")

          # The verify step below needs to know whether names were deliberately
          # left behind - otherwise it has to treat every mismatch as "probably
          # fine", which is exactly the case it exists to catch.
          echo "GUARD_SKIPPED_IMMUTABLE=${skip_immutable}" >> "${GITHUB_ENV}"

          tags=()
          for name in "${names[@]}"; do
            if [ "${skip_immutable}" = "true" ]; then
              case " ${immutable[*]} " in
              *" ${name} "*) continue ;;
              esac
            fi
            tags+=(-t "${IMAGE}:${name}")
          done

          # The set is asserted rather than trusted: this catches a reordering, a
          # changed short-SHA length, and a name silently dropped by the loop above.
          expected=5
          [ "${PRIMARY}" = "true" ] || expected=3
          skipped=0
          [ "${skip_immutable}" = "true" ] && skipped="${#immutable[@]}"
          if [ "$(( ${#tags[@]} / 2 ))" -ne "$(( expected - skipped ))" ]; then
            echo "::error::built $(( ${#tags[@]} / 2 )) names, expected $(( expected - skipped ))"
            exit 1
          fi
          if [ "${tags[-1]}" != "${IMAGE}:${TAG}" ]; then
            echo "::error::the version tag must be last, for GHCR's primary-tag display"
            exit 1
          fi

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      # Not a diagnostic for the migration but a permanent check: the set of names
      # this job publishes is derived in shell, and nothing else compares that
      # derivation against what the registry ends up holding. It runs after the
      # push because the registry is the only trustworthy answer.
      - name: ✅ Verify the published names
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}
          TAG: ${{ matrix.tag }}
          PRIMARY: ${{ matrix.primary }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"
          STAMP="r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          # A read that fails is not a name that is missing, and GHCR promises no
          # read-after-write, so a name written seconds ago can briefly read as
          # absent. Both are handled here, for every lookup this step makes - the
          # anchor included, which used to be a one-shot read that could fail a
          # correct publication on a momentary miss.
          resolve() {
            local name="$1" err out attempt
            err=$(mktemp)
            for attempt in 1 2 3; do
              if out=$(docker buildx imagetools inspect --raw "${IMAGE}:${name}" 2>"${err}"); then
                printf '%s' "${out}" | jq -r '.manifests[]?.digest' | sort -u
                rm -f "${err}"
                return 0
              fi
              grep -qE ': not found$|MANIFEST_UNKNOWN' "${err}" || break
              [ "${attempt}" -eq 3 ] || sleep 3
            done
            if grep -qE ': not found$|MANIFEST_UNKNOWN' "${err}"; then
              rm -f "${err}"
              return 1
            fi
            cat "${err}" >&2
            rm -f "${err}"
            return 2
          }

          # The anchor: the revision name belongs to this attempt alone, so no
          # other run can have moved it. Everything else is compared against it.
          if ! anchor=$(resolve "${TAG}-${STAMP}"); then
            echo "::error::${TAG}-${STAMP} does not resolve after publication - this run did not publish what it thinks"
            exit 1
          fi
          if [ -z "${anchor}" ]; then
            echo "::error::${TAG}-${STAMP} resolves to an index with no children"
            exit 1
          fi

          # Mutable names are checked but never fail the job: `concurrency` gives
          # every master push its own group on purpose, so a second run can move
          # `latest` and the version tag between the push above and this check.
          # That is a supported race, not a defect - CLAUDE.md keeps it deliberately.
          immutable=("${TAG}-sha-${SHA_SHORT}")
          mutable=("${TAG}")
          if [ "${PRIMARY}" = "true" ]; then
            immutable+=("sha-${SHA_SHORT}")
            mutable+=("latest")
          fi

          fail=0

          for name in "${immutable[@]}"; do
            if got=$(resolve "${name}"); then
              if [ "${got}" = "${anchor}" ]; then
                echo "${name}: matches this run"
              elif [ "${GUARD_SKIPPED_IMMUTABLE:-false}" = "true" ]; then
                echo "${name}: left on an earlier build of this commit, as the guard decided"
              else
                # The guard published this name in this run, so a mismatch is not
                # explainable - it means the set of names this job derives and the
                # set the registry holds have come apart.
                echo "::error::${name} does not match this run and the guard did not skip it"
                fail=1
              fi
            elif [ "$?" -eq 1 ]; then
              echo "::error::${name} does not exist after publication"
              fail=1
            else
              echo "::warning::could not read ${name} - registry unreachable, so this run is unverified rather than wrong"
            fi
          done
          for name in "${mutable[@]}"; do
            if got=$(resolve "${name}"); then
              if [ "${got}" = "${anchor}" ]; then
                echo "${name}: matches this run"
              else
                echo "${name}: moved on by a later run - expected under concurrent pushes"
              fi
            elif [ "$?" -eq 1 ]; then
              # Mutable names never fail this job - CLAUDE.md says so, and a tag
              # that a later run took over can also be absent for a moment, since
              # GHCR does not promise read-after-write.
              echo "::warning::${name} does not resolve right now - a concurrent run may be mid-publish"
            else
              echo "::warning::could not read ${name} - registry unreachable, so this run is unverified rather than wrong"
            fi
          done
          exit "${fail}"
