# PlatformIO Docker Build Workflow
#
# Build Strategy:
# - Main repo master: Build + Push to GHCR
# - Main repo dev/PR: Build only (validation) - nothing is uploaded. Unlike
#   esp-idf.yml, no other job consumes this image, so there is nothing to push for.
# - workflow_dispatch: Build on any branch of the main repo, push only on master
# - Forks: nothing runs - the runner pools are not reachable there; use
#   ./scripts/build.sh instead
# - Multi-platform: Platform matrix builds linux/amd64 and linux/arm64 in parallel,
#   each on a runner of its own architecture (matrix.runner) - no QEMU
name: 🐳 PlatformIO Docker Image

on:
  push:
    branches: [master, dev]
    # Negations come last and are order-sensitive; `paths:` and `paths-ignore:`
    # cannot both be used for one event. Documentation-only commits used to
    # trigger a full rebuild and republish every tag - the docs-only merge that
    # started this series set off a 5.5-hour ESP-Matter leg.
    paths:
      - '.github/workflows/platformio.yml'
      - 'images/platformio/**'
      - 'images/versions.json'
      - 'scripts/versions-matrix.sh'
      - 'scripts/check-versions.sh'
      - '!images/**/*.md'
  pull_request:
    branches: [master, dev]
    paths:
      - '.github/workflows/platformio.yml'
      - 'images/platformio/**'
      - 'images/versions.json'
      - 'scripts/versions-matrix.sh'
      - 'scripts/check-versions.sh'
      - '!images/**/*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORMIO_IMAGE_NAME: jethome-dev-platformio
  # build-push-action v6+ uploads a build record as a workflow artifact by default.
  # This repository is public, so that archive - full build log and metadata - would
  # be downloadable by anyone off the run page, on every leg of every push. The
  # summary itself is kept: it reports what was built without opening the log, and
  # costs no storage.
  DOCKER_BUILD_RECORD_UPLOAD: false

# Superseded pull-request runs are cancelled - nothing has been published yet and
# they cost money. Pushes are deliberately NOT grouped together: the group key
# includes the commit, so each one gets its own group and none can cancel another.
#
# `cancel-in-progress: false` would not have given a queue. GitHub cancels a
# *pending* run in a group whenever a newer one arrives, regardless of that flag -
# so grouping master pushes by ref would silently drop the middle commit of any
# three that land inside one build window, and its sha-<short-commit> image, which the
# READMEs document as the way to pin an exact commit, would never exist.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Both matrices come from images/versions.json, so a version lives in one place
  # instead of two matrix blocks that have to be edited together. The consistency
  # check runs first and fails the whole workflow.
  prepare:
    name: 🧮 Resolve matrices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'jethome-iot' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    outputs:
      build: ${{ steps.matrices.outputs.build }}
      manifest: ${{ steps.matrices.outputs.manifest }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ✅ Check version consistency
        run: ./scripts/check-versions.sh

      - name: 🧮 Generate matrices
        id: matrices
        run: |
          set -euo pipefail
          # Assigned first, echoed second: `echo "k=$(cmd)"` takes echo's exit
          # status, so a failing generator would write an empty matrix and leave
          # this step green.
          build=$(./scripts/versions-matrix.sh platformio build)
          manifest=$(./scripts/versions-matrix.sh platformio manifest)
          {
            echo "build=${build}"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"

  platformio-build:
    name: platformio-build (${{ matrix.tag }}, ${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # Owner-only, with no workflow_dispatch escape hatch: the runner pools belong
    # to jethome-iot, a fork cannot resolve their labels, and an unresolvable
    # `runs-on` queues for 24 hours rather than failing. A fork that wants to build
    # this image runs ./scripts/build.sh.
    # Two conditions, not one. The owner check keeps this out of forks that run the
    # workflow themselves. The head-repo check keeps it out of pull requests *from*
    # a fork, where github.repository_owner is still jethome-iot - so without it a
    # fork-controlled Dockerfile would execute on this org's paid runner pools.
    if: github.repository_owner == 'jethome-iot' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        if: github.ref_name == 'master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Pushed by digest, with no tag of its own: a tag here would be a mutable
      # name that the manifest job below has to look up again later, and between
      # those two moments another run can overwrite it. The digest is the only
      # thing handed forward.
      - name: 🐳 Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/platformio
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_name == 'master' }}
          build-args: ${{ matrix.build_args }}
          # Pinned rather than left to the action's default, which differs between
          # public and private repositories and has changed across majors. mode=max
          # records build-args and the event payload into a public attestation - see
          # CLAUDE.md before adding an ARG that carries anything sensitive.
          provenance: mode=max

      # Matrix legs cannot each set a job output - they would overwrite one
      # another - so the digests travel as one empty file per leg, named after the
      # digest itself.
      - name: 📤 Export digest
        if: github.ref_name == 'master'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: ⬆️ Upload digest
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORMIO_IMAGE_NAME }}-${{ matrix.tag }}-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  platformio-manifest:
    name: platformio-manifest (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, platformio-build]
    # See the note in esp-idf.yml: one variant's failure must not withhold another
    # variant's tags.
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && github.repository_owner == 'jethome-iot'
      && github.ref_name == 'master' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.manifest) }}
    steps:
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ env.PLATFORMIO_IMAGE_NAME }}-${{ matrix.tag }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: 🐳 Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}
          TAG: ${{ matrix.tag }}
          PRIMARY: ${{ matrix.primary }}
          EXPECTED_PLATFORMS: ${{ matrix.platform_count }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          found=$(find . -type f | wc -l | tr -d ' ')
          if [ "${found}" -ne "${EXPECTED_PLATFORMS}" ]; then
            echo "::error::expected ${EXPECTED_PLATFORMS} platform digests, found ${found}"
            exit 1
          fi
          # Every source is a digest this run produced, so nothing here can be
          # resolved to another run's image. Built as an array rather than an
          # unquoted expansion so the refs survive as separate arguments without
          # relying on word splitting.
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done

          SHA_SHORT="${GITHUB_SHA:0:7}"
          # The revision name: this attempt of this run. `run_id` is unique per
          # GitHub instance and shared by every leg of the matrix; `run_attempt`
          # is what distinguishes a re-run, which nothing else here does - the
          # commit is the same and, with no build cache, the image is not.
          STAMP="r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          # What the new index will contain: imagetools copies the CHILDREN of
          # each leg, not the leg index itself, so that is what an existing tag
          # has to be compared against. The index digest itself is no use for
          # this - it carries a fresh `created`, so it differs on every run even
          # when the layers are identical.
          new_children=$(for digest in *; do
            docker buildx imagetools inspect --raw "${IMAGE}@sha256:${digest}" | jq -r '.manifests[]?.digest'
          done | sort -u)

          # Write-once guard, per name rather than per operation. It resolves the
          # immutable names only - `latest` and the version tag are meant to move.
          # Three outcomes, and the third is why this is not a one-liner: a
          # registry that cannot answer must not read as "free".
          immutable=("${TAG}-sha-${SHA_SHORT}")
          if [ "${PRIMARY}" = "true" ]; then
            immutable+=("sha-${SHA_SHORT}")
          fi
          skip=""
          for name in "${immutable[@]}"; do
            probe_err=$(mktemp)
            if raw=$(docker buildx imagetools inspect --raw "${IMAGE}:${name}" 2>"${probe_err}"); then
              existing=$(printf '%s' "${raw}" | jq -r '.manifests[]?.digest' | sort -u)
              if [ "${existing}" = "${new_children}" ]; then
                echo "${name}: already published with identical contents - idempotent re-run"
              else
                # Deliberately a warning and a skip, not a failure: failing here
                # would withhold `latest` and the version tag too, turning the
                # ordinary "Re-run all jobs" recovery into a guaranteed red run
                # after a full multi-arch build.
                echo "::warning::${name} exists with different contents and will NOT be moved"
                echo "  existing: $(printf '%s' "${existing}" | tr '\n' ' ')"
                echo "  this run: $(printf '%s' "${new_children}" | tr '\n' ' ')"
                skip="${skip}${name}"$'\n'
              fi
            elif grep -qiE 'manifest unknown|MANIFEST_UNKNOWN|not found' "${probe_err}"; then
              echo "${name}: free"
            else
              echo "::error::cannot tell whether ${name} exists: $(cat "${probe_err}")"
              exit 1
            fi
            rm -f "${probe_err}"
          done

          # Only the primary variant moves `latest` and the bare `sha-<short-commit>`.
          # Every variant gets `<version>-sha-<short-commit>` and the revision name.
          # The version tag is passed LAST: GHCR shows the last one as the package's
          # primary tag.
          names=()
          if [ "${PRIMARY}" = "true" ]; then
            names+=("latest" "sha-${SHA_SHORT}")
          fi
          names+=("${TAG}-sha-${SHA_SHORT}" "${TAG}-${STAMP}" "${TAG}")

          tags=()
          for name in "${names[@]}"; do
            if printf '%s' "${skip}" | grep -qxF "${name}"; then
              continue
            fi
            tags+=(-t "${IMAGE}:${name}")
          done

          # The set is asserted rather than trusted: this catches a reordering, a
          # changed short-SHA length, and a name silently dropped by the loop above.
          expected=5
          [ "${PRIMARY}" = "true" ] || expected=3
          skipped=$(printf '%s' "${skip}" | grep -c . || true)
          if [ "$(( ${#tags[@]} / 2 ))" -ne "$(( expected - skipped ))" ]; then
            echo "::error::built $(( ${#tags[@]} / 2 )) names, expected $(( expected - skipped ))"
            exit 1
          fi
          if [ "${tags[-1]}" != "${IMAGE}:${TAG}" ]; then
            echo "::error::the version tag must be last, for GHCR's primary-tag display"
            exit 1
          fi

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      # Not a diagnostic for the migration but a permanent check: the set of names
      # this job publishes is derived in shell, and nothing else compares that
      # derivation against what the registry ends up holding. It runs after the
      # push because the registry is the only trustworthy answer.
      - name: ✅ Verify the published names
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PLATFORMIO_IMAGE_NAME }}
          TAG: ${{ matrix.tag }}
          PRIMARY: ${{ matrix.primary }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"
          STAMP="r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          # The revision name is the anchor: it belongs to this attempt alone, so
          # no other run can have moved it. Everything else is compared against
          # what it resolves to.
          anchor=$(docker buildx imagetools inspect --raw "${IMAGE}:${TAG}-${STAMP}" \
            | jq -r '.manifests[]?.digest' | sort -u)
          if [ -z "${anchor}" ]; then
            echo "::error::${TAG}-${STAMP} does not resolve - this run did not publish what it thinks"
            exit 1
          fi

          # Mutable names are checked but never fail the job: `concurrency` gives
          # every master push its own group on purpose, so a second run can move
          # `latest` and the version tag between the push above and this check.
          # That is a supported race, not a defect - CLAUDE.md keeps it deliberately.
          immutable=("${TAG}-sha-${SHA_SHORT}")
          mutable=("${TAG}")
          if [ "${PRIMARY}" = "true" ]; then
            immutable+=("sha-${SHA_SHORT}")
            mutable+=("latest")
          fi

          fail=0
          for name in "${immutable[@]}"; do
            err=$(mktemp)
            if raw=$(docker buildx imagetools inspect --raw "${IMAGE}:${name}" 2>"${err}"); then
              got=$(printf '%s' "${raw}" | jq -r '.manifests[]?.digest' | sort -u)
              if [ "${got}" = "${anchor}" ]; then
                echo "${name}: matches this run"
              else
                # Only legitimate when the guard above skipped it.
                echo "::warning::${name} does not match this run - expected if the guard skipped it, a defect otherwise"
              fi
            else
              echo "::error::${name} does not resolve after publication: $(cat "${err}")"
              fail=1
            fi
            rm -f "${err}"
          done
          for name in "${mutable[@]}"; do
            err=$(mktemp)
            if raw=$(docker buildx imagetools inspect --raw "${IMAGE}:${name}" 2>"${err}"); then
              got=$(printf '%s' "${raw}" | jq -r '.manifests[]?.digest' | sort -u)
              if [ "${got}" = "${anchor}" ]; then
                echo "${name}: matches this run"
              else
                echo "${name}: moved on by a later run - expected under concurrent pushes"
              fi
            else
              echo "::error::${name} does not resolve after publication: $(cat "${err}")"
              fail=1
            fi
            rm -f "${err}"
          done
          exit "${fail}"
