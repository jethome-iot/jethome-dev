# Host Docker Build Workflow
#
# Build Strategy:
# - Main repo master: Build + Push to GHCR
# - Main repo dev/PR: Build only (validation) - nothing is uploaded. Like
#   platformio.yml and unlike esp-idf.yml, no other image is built FROM this one,
#   so there is nothing for a pull request to push for.
# - workflow_dispatch: Build on any branch of the main repo, push only on master
# - Forks: nothing runs - the runner pools are not reachable there; use
#   ./scripts/build.sh instead
# - Multi-platform: Platform matrix builds linux/amd64 and linux/arm64 in parallel,
#   each on a runner of its own architecture (matrix.runner) - no QEMU. This image
#   is the one a developer on Apple Silicon runs interactively, so an emulated
#   arm64 leg would be the slow half of exactly the audience it exists for.
name: 🐳 Host Docker Image

on:
  push:
    branches: [master, dev]
    # Negations come last and are order-sensitive; `paths:` and `paths-ignore:`
    # cannot both be used for one event. Without the exclusion a
    # documentation-only commit rebuilds and republishes the image.
    paths:
      - '.github/workflows/host.yml'
      - 'images/host/**'
      - 'images/versions.json'
      - 'scripts/versions-matrix.sh'
      - 'scripts/check-versions.sh'
      - '!images/**/*.md'
  pull_request:
    branches: [master, dev]
    paths:
      - '.github/workflows/host.yml'
      - 'images/host/**'
      - 'images/versions.json'
      - 'scripts/versions-matrix.sh'
      - 'scripts/check-versions.sh'
      - '!images/**/*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  HOST_IMAGE_NAME: jethome-dev-host
  # build-push-action v6+ uploads a build record as a workflow artifact by default.
  # This repository is public, so that archive - full build log and metadata - would
  # be downloadable by anyone off the run page, on every leg of every push. The
  # summary itself is kept: it reports what was built without opening the log, and
  # costs no storage.
  DOCKER_BUILD_RECORD_UPLOAD: false

# Superseded pull-request runs are cancelled - nothing has been published yet and
# they cost money. Pushes are deliberately NOT grouped together: the group key
# includes the commit, so each one gets its own group and none can cancel another.
#
# `cancel-in-progress: false` would not have given a queue. GitHub cancels a
# *pending* run in a group whenever a newer one arrives, regardless of that flag -
# so grouping master pushes by ref would silently drop the middle commit of any
# three that land inside one build window, and its sha-<short-commit> image, which the
# READMEs document as the newest build made from a given commit, would never exist.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Both matrices come from images/versions.json, so a version lives in one place
  # instead of two matrix blocks that have to be edited together. The consistency
  # check runs first and fails the whole workflow.
  prepare:
    name: 🧮 Resolve matrices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'jethome-iot' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    outputs:
      build: ${{ steps.matrices.outputs.build }}
      manifest: ${{ steps.matrices.outputs.manifest }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ✅ Check version consistency
        run: ./scripts/check-versions.sh

      - name: 🧮 Generate matrices
        id: matrices
        run: |
          set -euo pipefail
          # Assigned first, echoed second: `echo "k=$(cmd)"` takes echo's exit
          # status, so a failing generator would write an empty matrix and leave
          # this step green.
          build=$(./scripts/versions-matrix.sh host build)
          manifest=$(./scripts/versions-matrix.sh host manifest)
          {
            echo "build=${build}"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"

  host-build:
    name: host-build (${{ matrix.tag }}, ${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # Owner-only, with no workflow_dispatch escape hatch: the runner pools belong
    # to jethome-iot, a fork cannot resolve their labels, and an unresolvable
    # `runs-on` queues for 24 hours rather than failing. A fork that wants to build
    # this image runs ./scripts/build.sh.
    # Two conditions, not one. The owner check keeps this out of forks that run the
    # workflow themselves. The head-repo check keeps it out of pull requests *from*
    # a fork, where github.repository_owner is still jethome-iot - so without it a
    # fork-controlled Dockerfile would execute on this org's paid runner pools.
    if: github.repository_owner == 'jethome-iot' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        if: github.ref_name == 'master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, with no tag of its own: a tag here would be a mutable
      # name that the manifest job below has to look up again later, and between
      # those two moments another run can overwrite it. The digest is the only
      # thing handed forward.
      - name: 🐳 Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/host
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.HOST_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_name == 'master' }}
          build-args: ${{ matrix.build_args }}
          # Pinned rather than left to the action's default, which differs between
          # public and private repositories and has changed across majors. mode=max
          # records build-args and the event payload into a public attestation - see
          # CLAUDE.md before adding an ARG that carries anything sensitive.
          #
          # Its `subject[].name` reads `pkg:docker/<image>@latest?platform=...` on
          # every image this repository publishes, and that is not a misconfiguration
          # to fix: `push-by-digest=true` supplies no tag, so buildx fills in the
          # placeholder, and naming one in `name=` is refused outright - `can't push
          # tagged ref <image>:<tag> by digest`, measured against a local registry.
          # The digest beside the name is correct and is what identifies the image;
          # the name is not.
          provenance: mode=max

      # Matrix legs cannot each set a job output - they would overwrite one
      # another - so the digests travel as one empty file per leg, named after the
      # digest itself.
      - name: 📤 Export digest
        if: github.ref_name == 'master'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: ⬆️ Upload digest
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.HOST_IMAGE_NAME }}-${{ matrix.tag }}-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  host-manifest:
    name: host-manifest (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, host-build]
    # See the note in esp-idf.yml: one variant's failure must not withhold another
    # variant's tags.
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && github.repository_owner == 'jethome-iot'
      && github.ref_name == 'master' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.manifest) }}
    steps:
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ env.HOST_IMAGE_NAME }}-${{ matrix.tag }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: 🐳 Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.HOST_IMAGE_NAME }}
          TAG: ${{ matrix.tag }}
          PRIMARY: ${{ matrix.primary }}
          EXPECTED_PLATFORMS: ${{ matrix.platform_count }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          found=$(find . -type f | wc -l | tr -d ' ')
          if [ "${found}" -ne "${EXPECTED_PLATFORMS}" ]; then
            echo "::error::expected ${EXPECTED_PLATFORMS} platform digests, found ${found}"
            exit 1
          fi
          # Every source is a digest this run produced, so nothing here can be
          # resolved to another run's image. Built as an array rather than an
          # unquoted expansion so the refs survive as separate arguments without
          # relying on word splitting.
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          # Only the primary variant moves `latest` and the bare `sha-<short-commit>`.
          # Every variant gets `<version>-sha-<short-commit>`: the version tag itself is
          # rewritten on every push, so without it a consumer pinned to a
          # non-primary variant has no name for the build they were running.
          SHA_SHORT="${GITHUB_SHA:0:7}"
          # And the revision name: one build, never moved. `<version>-sha-<commit>`
          # cannot do that job, because a rebuild of the same commit rewrites it -
          # the commit is identical and, with no build cache, the image is not.
          # `run_id` is unique per GitHub instance and shared by every leg of the
          # matrix; `run_attempt` is what a re-run changes.
          STAMP="r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          tags=()
          if [ "${PRIMARY}" = "true" ]; then
            tags+=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          tags+=(-t "${IMAGE}:${TAG}-sha-${SHA_SHORT}")
          tags+=(-t "${IMAGE}:${TAG}-${STAMP}")
          tags+=(-t "${IMAGE}:${TAG}")

          # Index-level annotations: the metadata a consumer reads straight off the
          # registry, and the reason a LABEL alone is not enough. A LABEL is
          # inherited through FROM, so an image that forgets to override one reports
          # its base's value - `org.opencontainers.image.version` read `24.04` on
          # both esp-idf and host, inherited from ubuntu, for as long as those
          # images have existed. An annotation is written onto THIS index and
          # inherits nothing, so the same mistake is not available here.
          #
          # `index:` is the level a tag resolves to. `manifest-descriptor:` would
          # annotate the per-platform entries uniformly, which is wrong for anything
          # that genuinely differs per platform, and `imagetools create` offers no
          # `manifest:` level at all - so per-platform facts stay in the
          # Dockerfile's LABELs, which is where the base image reference lives.
          #
          # revision carries the full 40 hex where the tags carry 7: a tag is a name
          # and wants to be short, an annotation is data and wants to be
          # unambiguous. It is also the only place the commit survives at all for a
          # consumer pinned by digest, who by construction kept no tag to read.
          #
          # No `licenses`, deliberately. OCI defines it as the licence of the
          # *contained software*, and these images contain GCC and binutils under
          # GPL-3.0, a distribution's worth of packages, and ESP-IDF under
          # Apache-2.0. `MIT` is this repository's own licence and would give a
          # licence scanner a wrong answer; an SPDX expression covering what is
          # actually in here is not something this job can compute. `source` points
          # at the repository, where LICENSE says what jethome-dev is under.
          SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          # Assigned rather than inlined into the array: a command substitution that
          # fails inside `arr+=(...)` leaves an empty value behind and a green step,
          # while a plain assignment under `set -e` stops here.
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          annotations=()
          annotations+=(--annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}")
          annotations+=(--annotation "index:org.opencontainers.image.source=${SOURCE}")
          annotations+=(--annotation "index:org.opencontainers.image.url=${SOURCE}")
          annotations+=(--annotation "index:org.opencontainers.image.created=${CREATED}")
          annotations+=(--annotation "index:org.opencontainers.image.version=${TAG}")
          annotations+=(--annotation "index:org.opencontainers.image.title=${IMAGE##*/}")
          create_args=("${annotations[@]}" "${tags[@]}")

          # Checked rather than trusted, and locally - no registry round-trip.
          # Three of these warn and one fails, deliberately: this job runs on
          # master only, so nothing here is exercised by a pull request and a
          # failure first appears AFTER a full multi-arch build. A bad `PRIMARY`,
          # a miscount or a misordered version tag each cost a name too many, too
          # few, or the wrong one shown as the package's primary - worth a line in
          # the log. An argument list that is not `<flag> <value>` pairs would
          # publish a CORRUPTED index, which is worse than publishing nothing.
          #
          # `PRIMARY` decides both what goes into the array and what is expected of
          # it, so a value that is neither `true` nor `false` - a renamed matrix
          # key, a missing one - would quietly drop `latest` and the bare
          # `sha-<short-commit>` with the count still agreeing. Checked before use.
          case "${PRIMARY}" in
          true|false) ;;
          *) echo "::warning::PRIMARY is '${PRIMARY}', expected true or false; the primary-only names may be missing" ;;
          esac

          # `create_args` must alternate `<flag> <value>` strictly, and this FAILS
          # rather than warns: `imagetools create` reads every non-flag argument as
          # a SOURCE, so any entry that is not a flag and not preceded by one gets
          # merged into the published index - folding whatever a mutable tag points
          # at into this image. Publishing a corrupted index is worse than
          # publishing nothing, which is not true of the count below.
          #
          # The flag set is closed on purpose. `--annotation` joined `-t` here
          # because both take a value, and a value-taking flag is exactly what
          # swallows the argument after it when one goes missing; a boolean flag
          # would pass this check and then shift every pair after it, so anything
          # this array needs beyond `<flag> <value>` belongs on the command line,
          # not in here.
          #
          # Parity alone was not enough: it says nothing about WHERE the flags sit,
          # so `-t -t <name> <name>` passed it. It is still checked first, so that
          # reading `[i + 1]` below cannot run off the end of the array.
          if [ "$(( ${#create_args[@]} % 2 ))" -ne 0 ]; then
            echo "::error::${#create_args[@]} arguments cannot be <flag> <value> pairs"
            exit 1
          fi
          i=0
          while [ "${i}" -lt "${#create_args[@]}" ]; do
            case "${create_args[${i}]}" in
            -t|--annotation) ;;
            *)
              echo "::error::create_args[${i}] is '${create_args[${i}]}', expected -t or --annotation; a stray argument would be merged as a source"
              exit 1
              ;;
            esac
            case "${create_args[$(( i + 1 ))]}" in
            -*)
              echo "::error::create_args[$(( i + 1 ))] is '${create_args[$(( i + 1 ))]}', expected a value; the next argument would be consumed as its value"
              exit 1
              ;;
            esac
            i=$(( i + 2 ))
          done
          # The count is only a warning: being wrong here publishes a name too many
          # or too few, which is a nuisance, not a corrupted image.
          expected=5
          [ "${PRIMARY}" = "true" ] || expected=3
          if [ "$(( ${#tags[@]} / 2 ))" -ne "${expected}" ]; then
            echo "::warning::built $(( ${#tags[@]} / 2 )) names, expected ${expected}"
          fi
          # Positive index rather than `${tags[-1]}`: negative subscripts need
          # bash 4.3. This step assumes bash throughout - arrays, substring
          # expansion, `pipefail` - so the point is the version, not the shell.
          if [ "${tags[$(( ${#tags[@]} - 1 ))]}" != "${IMAGE}:${TAG}" ]; then
            echo "::warning::the version tag is not last; GHCR will show a different one as the package's primary tag"
          fi

          # This job runs on ubuntu-latest with whatever buildx the runner image
          # ships - there is no setup-buildx-action here, because `imagetools`
          # talks to the registry and needs no builder - so the flag is checked
          # rather than assumed. Before publishing, not after: a buildx without it
          # would reject the whole command and leave this run's images in GHCR with
          # no tag at all.
          #
          # What this proves is exactly that the flag is accepted, and nothing
          # more. Whether that buildx also understands the `index:` prefix, and
          # whether its `inspect` surfaces annotations at all, are separate
          # questions - and the read-back below answers both, which is why it tells
          # an index with no annotations apart from one annotating the wrong
          # commit.
          if ! docker buildx imagetools create --help | grep -q -- '--annotation'; then
            echo "::error::this buildx does not support --annotation"
            exit 1
          fi

          # Not `set -e`'s to decide. `imagetools create` writes the tags as
          # sequential PUTs and stops at the first error, so a failure here can
          # still have moved names - `latest` is written first, which makes the
          # half-done case the dangerous one. The record below is written either
          # way, and carries which case it was.
          create_ok=true
          docker buildx imagetools create "${create_args[@]}" "${refs[@]}" || create_ok=false

          # The ledger record, written HERE - the first moment anything is
          # published, and before the verification below, which can exit non-zero.
          # A revision that reached the registry and then failed its read-back is
          # exactly the one worth having recorded: the names are live whatever this
          # job's exit status says, and a ledger that omits them describes a
          # registry that does not exist. Written only on a successful create, so
          # the record exists if and only if something was published.
          #
          # It travels to the registrar as an artifact, the same way the build legs'
          # digests travel to this job - a matrix leg cannot set a job output, they
          # would overwrite one another.
          #
          # `run_attempt` is carried in the record rather than read by the registrar
          # from its own environment. Re-running the registrar alone starts a new
          # attempt, while the artifacts it reads still describe the one that
          # published; taking the value from the environment would file this
          # publication under a revision that was never published, contradicting the
          # `names` in the same file.
          #
          # `names` is built from the array rather than restated, so a name that is
          # published and a name that is recorded cannot drift apart.
          # Cleared, not just created, and the upload takes `*.json`: this leg
          # uploads what it wrote, not whatever the directory happens to hold. The
          # registrar takes the same precaution with /tmp/out, and for the same
          # reason - a reused runner.
          rm -rf /tmp/ledger && mkdir -p /tmp/ledger
          record="/tmp/ledger/${IMAGE##*/}-${TAG}.json"
          i=1
          names=()
          while [ "${i}" -lt "${#create_args[@]}" ]; do
            [ "${create_args[$(( i - 1 ))]}" = "-t" ] && names+=("${create_args[${i}]##*:}")
            i=$(( i + 2 ))
          done
          jq -n \
            --arg image "${IMAGE##*/}" --arg tag "${TAG}" --arg primary "${PRIMARY}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg created "${CREATED}" \
            --arg create_ok "${create_ok}" \
            --args '{image: $image, tag: $tag, primary: ($primary == "true"),
                     run_id: $run_id, run_attempt: ($attempt | tonumber),
                     create_ok: ($create_ok == "true"),
                     digest: null, created: $created, names: $ARGS.positional}' \
            "${names[@]}" > "${record}" \
            || { echo "::error::published, but the ledger record could not be written - this publication will not be recorded"; exit 1; }

          # Only now, because everything below reads back what was published and
          # there is nothing coherent to read back from a write that stopped
          # halfway.
          if [ "${create_ok}" != "true" ]; then
            echo "::error::imagetools create failed. It writes tags one at a time and stops at the first error, so some names may already be live - recorded with create_ok:false, which means 'names' is what was attempted rather than what landed."
            exit 1
          fi

          # Read back what was published, by the one name this run alone holds.
          # Deliberately not `${IMAGE}:${TAG}`: concurrent master runs are allowed
          # to overwrite the version tag and `latest` - that is why `concurrency`
          # groups by github.sha rather than by ref - so re-reading a mutable name
          # can legitimately return another run's index. That is inconclusive, not
          # a mismatch, and the revision name is the one thing no other run can be
          # holding.
          #
          # Three outcomes, and the middle one is the point: annotations that agree
          # (a line in the log), a read that did not happen (a warning - GHCR being
          # unreachable is not evidence about what was written), and annotations
          # that disagree (an error). The error cannot unpublish anything, since the
          # tags are already written; what it buys is that a run does not go green
          # while publishing images whose revision says nothing.
          if published=$(docker buildx imagetools inspect "${IMAGE}:${TAG}-${STAMP}" \
              --format '{{json .Manifest}}' 2>/dev/null); then
            written=$(printf '%s' "${published}" | jq -r '(.annotations // {}) | length')
            got=$(printf '%s' "${published}" \
              | jq -r '.annotations["org.opencontainers.image.revision"] // ""')
            if [ "${written}" -eq 0 ]; then
              echo "::error::the published index carries no annotations at all - this buildx took --annotation and wrote nothing readable at index level, or its inspect does not surface them. The tags are already published; the metadata is not."
              exit 1
            fi
            if [ "${got}" != "${GITHUB_SHA}" ]; then
              echo "::error::published index annotates revision '${got}', expected '${GITHUB_SHA}'"
              exit 1
            fi
            # The digest of this run's own index, logged from the read that was
            # already made. `${IMAGE}:${TAG}` used to be inspected separately for
            # this line, which cost a second registry round-trip to resolve a name
            # another run is allowed to have taken meanwhile.
            digest=$(printf '%s' "${published}" | jq -er '.digest')
            echo "published ${IMAGE}:${TAG}-${STAMP} as ${digest}, revision ${got}"
            # The record already exists; this is the one field only the read-back
            # can supply. It stays null when that read did not happen - a publish
            # whose digest is unknown, which the registrar reports rather than
            # drops, because the names were written either way.
            patched=$(mktemp)
            jq --arg d "${digest}" '.digest = $d' "${record}" > "${patched}"
            mv "${patched}" "${record}"
          else
            echo "::warning::could not read back ${IMAGE}:${TAG}-${STAMP}; annotations unverified"
          fi

      # The attempt is part of the name because artifacts are immutable from
      # upload-artifact v4 on: re-uploading a name fails. Without it, re-running a
      # manifest job - the very thing the digest artifacts' 7-day retention exists
      # to make possible - would die here on a duplicate. With it, both attempts'
      # records survive side by side and the registrar files each under the
      # revision that published it.
      #
      # Runs even when the step above failed: a revision can reach the registry and
      # then fail its read-back, and that record is precisely the one the ledger
      # must not lose. `ignore` rather than `error` because the record exists if and
      # only if `imagetools create` succeeded - a leg that published nothing has
      # nothing to record, which is not a fault of the ledger. Losing every record
      # is still caught, by the registrar, which fails on an empty set.
      - name: ⬆️ Upload ledger record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ledger-${{ env.HOST_IMAGE_NAME }}-${{ matrix.tag }}-${{ github.run_attempt }}
          path: /tmp/ledger/*.json
          if-no-files-found: ignore
          retention-days: 7

  # ── the build ledger ────────────────────────────────────────────────────────
  #
  # What this answers is the question the registry cannot: "which images were
  # published from commit X". A tag answers the other direction and only until
  # someone rewrites or deletes it, an index annotation dies with the index it is
  # written on, and a run log expires - GHCR has already served 410 for one. So the
  # record lives outside the registry, in git, where nothing in this pipeline can
  # reach it.
  #
  # It is written to an ORPHAN BRANCH, not to master: the "Master" ruleset carries
  # a `pull_request` rule with no bypass actors, which closes direct pushes to
  # anyone including GITHUB_TOKEN. `builds` is outside that ruleset - it targets
  # `refs/heads/master` alone - and outside the build triggers too, since every
  # build workflow is gated on `branches: [master, dev]`, so a ledger commit
  # rebuilds nothing. That is a stronger guarantee than a `paths:` argument, and it
  # is why the branch is preferable to a directory in master even setting the
  # ruleset aside.
  #
  # The price, stated plainly: these jobs - one per build workflow, so three of
  # them - are the only ones in the repository holding `contents: write`. Each
  # writes one directory of the orphan branch and nothing else, and touches no
  # registry at all.
  ledger:
    name: 📒 Build ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, host-manifest]
    # `!cancelled()` with an explicit prepare check, like every job downstream of a
    # multi-variant matrix: one variant failing must not withhold the record of the
    # ones that published. Missing records are reported by the step below, which is
    # the right blast radius.
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && github.repository_owner == 'jethome-iot'
      && github.ref_name == 'master' }}
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          # Stated rather than inherited. The three ledger jobs are the only ones
          # in the repository that push, and they push with the credential this
          # action leaves in
          # the checkout; the action's default is not something a floating major
          # promises to keep, and if it changed the push would simply stop
          # authenticating.
          persist-credentials: true

      - name: ⬇️ Download ledger records
        uses: actions/download-artifact@v8
        with:
          pattern: ledger-*
          merge-multiple: true
          path: /tmp/ledger

      - name: 📒 Record this run on the builds branch
        run: |
          set -euo pipefail
          # The directory is created here, not assumed: `download-artifact` makes
          # none when the pattern matches nothing, and with `if-no-files-found:
          # ignore` upstream that is now an ordinary outcome of a failed build. A
          # `find` over a missing path exits non-zero, and under pipefail that
          # killed the step with a bare "No such file or directory" - the error
          # below could never print. Counted with the same non-recursive glob every
          # reader here uses, so the guard covers what is actually read.
          mkdir -p /tmp/ledger
          shopt -s nullglob
          records=(/tmp/ledger/*.json)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "::error::no ledger records: no manifest leg got as far as publishing. This job is a symptom - the cause is in the manifest jobs above."
            exit 1
          fi

          SHA_SHORT="${GITHUB_SHA:0:7}"

          # One file per image per REVISION, not per commit: a rebuild of the same
          # commit is a different set of images, which is the whole reason the
          # revision name exists. Keyed by commit alone, the second build would
          # overwrite the first one's record and the ledger would answer the
          # question wrongly rather than not at all.
          #
          # The revision comes out of the RECORDS, never out of this job's own
          # environment. Re-running the registrar alone starts a new attempt while
          # the artifacts still describe the one that published, and a partial
          # re-run can hand this job records from two different attempts at once.
          # Grouping by (image, run_id, attempt) is what makes both cases come out
          # right instead of filing a publication under a revision nobody published.
          #
          # /tmp/out is cleared, not just created: everything below copies what this
          # step produced, and a leftover file from an earlier run on a reused
          # runner would otherwise be recorded as part of this one.
          rm -rf /tmp/out && mkdir -p /tmp/out
          # Assigned before the loop rather than piped into it. `jq -s` is
          # all-or-nothing over its inputs, so one unparseable record fails the
          # whole slurp - and inside a process substitution that failure is
          # invisible to both `set -e` and `pipefail`. The loop would then read
          # nothing, copy nothing, and the "no changes" branch below would report
          # `already recorded` and exit 0: a green job that wrote no ledger at all.
          groups=$(jq -sr '[ .[] | "\(.image) \(.run_id) \(.run_attempt)" ] | unique[]' "${records[@]}")
          files=()
          while read -r image run_id attempt; do
            stamp="r${run_id}.${attempt}"
            out="/tmp/out/${image}-${stamp}.json"
            files+=("${image}-${stamp}")
            jq -s \
              --arg commit "${GITHUB_SHA}" --arg image "${image}" \
              --arg run_id "${run_id}" --argjson attempt "${attempt}" \
              --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${attempt}" \
              '[ .[] | select(.image == $image and .run_id == $run_id and .run_attempt == $attempt) ] as $v
               | { commit: $commit, image: $image,
                   run_id: $run_id, run_attempt: $attempt, run_url: $url,
                   variants: ($v | map(del(.image, .run_id, .run_attempt)) | sort_by(.tag)) }' \
              /tmp/ledger/*.json > "${out}"
            missing=$(jq -r '[.variants[] | select(.digest == null)] | length' "${out}")
            [ "${missing}" -eq 0 ] \
              || echo "::warning::${image} ${stamp}: ${missing} variant(s) recorded without a digest - the read-back either did not happen or did not agree"
          done <<< "${groups}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::${#records[@]} record(s) read but no group came out of them"
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Re-applied rather than rebased on a rejected push. Three workflows can
          # finish within seconds of each other on one commit, and all three push
          # here; a rebase over a shallow clone is a way to get that wrong, while
          # redoing the work is idempotent - every run writes paths no other run
          # writes, so there is nothing to merge.
          for attempt in 1 2 3 4 5; do
            # Every attempt starts from the same state. Without this, a first push
            # that failed for any reason other than a race - no permission, a 5xx,
            # a network blip - left a local `builds` behind, and attempt 2 died on
            # `a branch named 'builds' already exists` after one retry rather than
            # the five this loop advertises.
            # Guarded: `--detach` is fatal on an unborn HEAD. `actions/checkout`
            # never leaves one, but the failure is a hard stop with a message
            # about branches rather than about the ledger, and the guard is a line.
            git rev-parse -q --verify HEAD >/dev/null && git checkout -q --detach
            git branch -qD builds >/dev/null 2>&1 || true
            # `ls-remote --exit-code` tells "the branch is not there" (2) apart from
            # "the remote would not answer" (anything else); a bare `fetch
            # 2>/dev/null` conflated the two, so a rejected token looked exactly
            # like a first run.
            probe=0
            git ls-remote --exit-code --heads origin builds >/dev/null || probe=$?
            if [ "${probe}" -eq 0 ]; then
              git fetch --depth=1 origin builds
              git checkout -q -B builds FETCH_HEAD
            elif [ "${probe}" -ne 2 ]; then
              echo "::error::cannot read ${GITHUB_REPOSITORY} to find out whether the builds branch exists"
              exit 1
            else
              # First write ever: an orphan branch, and the code checkout cleared
              # out of it. `git rm -rf .` empties index and worktree together, which
              # `checkout --orphan` deliberately does not do - it keeps the index.
              git checkout -q --orphan builds
              # Not silenced, and not `|| true`. `--orphan` keeps the index it
              # inherited, so this is the only thing standing between the ledger
              # branch and a full copy of master's tree - committed silently, and
              # then carried forward by every later run that fetches this tip.
              git rm -rqf . \
                || { echo "::error::could not clear the worktree for the orphan branch"; exit 1; }
              cat > README.md <<'LEDGER'
          # Build ledger

          Written by CI, one commit per workflow run. Not part of the source tree -
          this is an orphan branch with no history in common with `master`, and
          nothing here is built or tested.

          Layout: `<short-commit>/<package>-r<run-id>.<attempt>.json`, where the
          package is the GHCR one (`jethome-dev-esp-idf`), not the directory under
          `images/`. Keyed by
          revision rather than by commit, because a rebuild of the same commit
          produces different images.

          Each file records the commit in full, the run that built it, and for every
          variant its published names and the digest of the index they were written
          onto. That digest is what the registry cannot be asked for later: tags are
          rewritten and deleted, and an index annotation dies with its index.

          Two fields qualify the rest. `create_ok: false` means the tag write
          stopped partway - the names are what was attempted, not what landed, and
          the registry is the only place that can say which. `digest: null` means
          the published index was never read back, either because the registry was
          unreachable or because the read disagreed and failed the job.
          LEDGER
            fi

            mkdir -p "${SHA_SHORT}"
            for name in "${files[@]}"; do
              cp "/tmp/out/${name}.json" "${SHA_SHORT}/${name}.json"
            done

            git add -A
            if git diff --cached --quiet; then
              echo "already recorded: ${files[*]}"
              exit 0
            fi
            git commit -q -m "${SHA_SHORT}: ${files[*]}"

            if git push -q origin builds; then
              echo "recorded ${#files[@]} file(s) under ${SHA_SHORT}/: ${files[*]}"
              exit 0
            fi
            # Not necessarily a race: a ruleset, a revoked permission and a 5xx all
            # land here too. git's own message is above this line; this one only
            # says what happens next.
            echo "push failed on attempt ${attempt} of 5; re-reading the branch and rebuilding on its tip"
            # Not after the last one: there is nothing left to back off for.
            [ "${attempt}" -lt 5 ] && sleep "$(( attempt * 5 ))"
          done
          echo "::error::could not write the ledger after 5 attempts"
          exit 1
