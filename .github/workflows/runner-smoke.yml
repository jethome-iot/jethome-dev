# Runner Smoke Test
#
# Probes every runner label this repository intends to use and reports what the
# machine behind it actually is. It builds nothing and publishes nothing.
#
# Why this exists: larger-runner labels are not predefined by GitHub - each one is
# the name of a pool an org admin created, so a typo is indistinguishable from a
# pool that does not exist. A job requesting a label nothing matches sits queued
# for up to 24 hours without any diagnostic, and `timeout-minutes` does not help:
# it starts counting when the job is assigned, not when it is queued. If a leg
# below has not started within a few minutes, that label is wrong - cancel the run.
#
# The other question it answers is disk. GitHub does not publish free space for
# larger runners, and images/esp-matter needs ~50 GB for the connectedhomeip
# submodule tree, so the numbers this workflow prints decide which pool that build
# can run on at all.
#
# Run it from the Actions tab (workflow_dispatch); nothing triggers it otherwise.
name: 🔎 Runner Smoke Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: 🔎 ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner:
          # GitHub-hosted standard runners, used as the reference point
          - ubuntu-latest
          - ubuntu-24.04-arm
          # larger runner pools, x86_64
          - ubuntu-latest-4core
          - ubuntu-latest-8core
          - ubuntu-latest-16core
          - ubuntu-latest-32core
          # larger runner pools, arm64
          - ubuntu-latest-4core-arm
          - ubuntu-latest-8core-arm
          - ubuntu-latest-16core-arm
          - ubuntu-latest-32core-arm
    steps:
      - name: 🧾 Report runner facts
        run: |
          set -u
          DOCKER_ROOT=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
          ROOT_FREE=$(df -BG --output=avail / | tail -1 | tr -d ' G')
          DOCKER_FREE=$(df -BG --output=avail "${DOCKER_ROOT}" | tail -1 | tr -d ' G')
          MEM_GB=$(awk '/^MemTotal:/ {printf "%.1f", $2/1024/1024}' /proc/meminfo)

          {
            echo "### ${{ matrix.runner }}"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| runner name | ${RUNNER_NAME:-unknown} |"
            echo "| arch | $(uname -m) |"
            echo "| vCPU | $(nproc) |"
            echo "| RAM | ${MEM_GB} GB |"
            echo "| free on / | ${ROOT_FREE} GB |"
            echo "| docker root | ${DOCKER_ROOT} |"
            echo "| free on docker root | ${DOCKER_FREE} GB |"
            echo "| os | $(. /etc/os-release && echo "${PRETTY_NAME}") |"
            echo "| kernel | $(uname -r) |"
            echo "| docker | $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unavailable) |"
            echo "| buildx | $(docker buildx version 2>/dev/null | awk '{print $2}' || echo unavailable) |"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::notice title=${{ matrix.runner }}::$(uname -m), $(nproc) vCPU, ${MEM_GB} GB RAM, ${DOCKER_FREE} GB free on ${DOCKER_ROOT}"

      - name: 💽 Full disk layout
        run: df -h
