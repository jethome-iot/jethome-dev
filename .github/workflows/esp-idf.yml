# ESP-IDF Docker Build Workflow
# Builds ESP-IDF development image with pytest, QEMU, and testing tools
#
# Build Strategy:
# - Main repo master: Build + Push to GHCR
# - Main repo dev/PR: Build only (validation)
# - workflow_dispatch: Build on any branch of the main repo, push only on master
# - Forks: nothing runs - the runner pools are not reachable there; use
#   ./scripts/build.sh instead
# - Multi-platform: Platform matrix builds linux/amd64 and linux/arm64 in parallel,
#   each on a runner of its own architecture (matrix.runner) - no QEMU
#
# ESP-Matter exception: esp-matter-build needs esp-idf-manifest, which runs for
# jethome-iot on master only, so the ESP-Matter jobs are skipped (not
# build-validated) on dev, on pull requests, on workflow_dispatch outside master,
# and in forks entirely. The image is built FROM the esp-idf digest that manifest
# job publishes and hands over in the same run.
# Consequence: a change touching only images/esp-matter/** still matches the paths
# filter below, so esp-idf-build runs on its unchanged context and this workflow
# reports success - a green check here does not mean ESP-Matter compiles.
# Validate it with ./scripts/build.sh esp-matter, or on master.
name: 🐳 ESP-IDF Docker Image

on:
  push:
    branches: [master, dev]
    paths:
      - '.github/workflows/esp-idf.yml'
      - 'images/esp-idf/**'
      - 'images/esp-matter/**'
  pull_request:
    branches: [master, dev]
    paths:
      - '.github/workflows/esp-idf.yml'
      - 'images/esp-idf/**'
      - 'images/esp-matter/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ESP_IDF_IMAGE_NAME: jethome-dev-esp-idf
  ESP_MATTER_IMAGE_NAME: jethome-dev-esp-matter
  # build-push-action v6+ uploads a build record as a workflow artifact by default.
  # This repository is public, so that archive - full build log and metadata - would
  # be downloadable by anyone off the run page, on every leg of every push. The
  # summary itself is kept: it reports what was built without opening the log, and
  # costs no storage.
  DOCKER_BUILD_RECORD_UPLOAD: false

# Superseded pull-request runs are cancelled - nothing has been published yet and
# they cost money. Pushes are deliberately NOT grouped together: the group key
# includes the commit, so each one gets its own group and none can cancel another.
#
# `cancel-in-progress: false` would not have given a queue. GitHub cancels a
# *pending* run in a group whenever a newer one arrives, regardless of that flag -
# so grouping master pushes by ref would silently drop the middle commit of any
# three that land inside one build window, and its sha-<commit> image, which the
# READMEs document as the way to pin an exact commit, would never exist.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  esp-idf-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Owner-only, with no workflow_dispatch escape hatch: the runner pools belong
    # to jethome-iot, a fork cannot resolve their labels, and an unresolvable
    # `runs-on` queues for 24 hours rather than failing. A fork that wants to build
    # these images runs ./scripts/build.sh.
    if: github.repository_owner == 'jethome-iot'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ['v5.4.1']
        platform: ['linux/amd64', 'linux/arm64']
        include:
          - version: 'v5.4.1'
            idf_base_tag: 'v5.4.1'
          # Each platform builds on its own architecture; the arm64 leg was QEMU
          # on an x86 runner before this. A platform value with no entry here
          # leaves runs-on empty and the leg never starts - actionlint does not
          # catch that.
          - platform: 'linux/amd64'
            runner: 'ubuntu-latest-8core'
          - platform: 'linux/arm64'
            runner: 'ubuntu-latest-8core-arm'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        if: github.ref_name == 'master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "platform_tag=${PLATFORM_TAG}" >> "$GITHUB_OUTPUT"

      # Pushed by digest, with no tag of its own: a tag here would be a mutable
      # name that the manifest job below has to look up again later, and between
      # those two moments another run can overwrite it. The digest is the only
      # thing handed forward.
      - name: 🐳 Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/esp-idf
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_IDF_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_name == 'master' }}
          build-args: |
            IDF_BASE_TAG=${{ matrix.idf_base_tag }}

      # Matrix legs cannot each set a job output - they would overwrite one
      # another - so the digests travel as one empty file per leg, named after the
      # digest itself.
      - name: 📤 Export digest
        if: github.ref_name == 'master'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: ⬆️ Upload digest
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.ESP_IDF_IMAGE_NAME }}-${{ matrix.version }}-${{ steps.tags.outputs.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  esp-idf-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: esp-idf-build
    if: github.repository_owner == 'jethome-iot' && github.ref_name == 'master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ['v5.4.1']
        include:
          - version: 'v5.4.1'
            idf_base_tag: 'v5.4.1'
    steps:
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ env.ESP_IDF_IMAGE_NAME }}-${{ matrix.version }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: 🐳 Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_IDF_IMAGE_NAME }}
          VERSION: ${{ matrix.version }}
          EXPECTED_PLATFORMS: 2
        run: |
          # pipefail matters below: jq exits 0 on empty input, so without it a
          # failed `imagetools inspect` would yield an empty digest and a green step.
          set -euo pipefail
          cd /tmp/digests

          # One file per platform leg. Fewer means a leg failed while fail-fast
          # let the others through, and publishing a single-platform image under
          # the multi-arch tags is worse than failing here.
          found=$(find . -type f | wc -l | tr -d ' ')
          if [ "${found}" -ne "${EXPECTED_PLATFORMS}" ]; then
            echo "::error::expected ${EXPECTED_PLATFORMS} platform digests, found ${found}"
            exit 1
          fi

          # Every source is a digest this run produced, so nothing here can be
          # resolved to another run's image. Built as an array rather than an
          # unquoted expansion, so the refs survive as separate arguments without
          # relying on word splitting. The version tag goes last on purpose: GHCR
          # shows the last one as the package's primary tag.
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          SHA_SHORT="${GITHUB_SHA:0:7}"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${SHA_SHORT}" \
            -t "${IMAGE}:idf-${VERSION}" \
            "${refs[@]}"

          # Hand the manifest's own digest to esp-matter-build, so it builds FROM
          # the exact image this run published rather than whatever the tag points
          # at by the time it starts. It travels as an artifact rather than a job
          # output because this job has a matrix: a scalar output would be
          # overwritten by whichever leg finished last, silently pinning
          # esp-matter to an arbitrary ESP-IDF version once there is more than one.
          digest=$(docker buildx imagetools inspect "${IMAGE}:idf-${VERSION}" \
            --format '{{json .Manifest}}' | jq -er '.digest')
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::manifest digest not resolved: '${digest}'"; exit 1 ;;
          esac
          mkdir -p /tmp/manifest
          printf '%s' "${digest}" > /tmp/manifest/digest
          echo "published ${IMAGE}:idf-${VERSION} as ${digest}"

      - name: ⬆️ Upload base image digest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-digest-${{ env.ESP_IDF_IMAGE_NAME }}-${{ matrix.version }}
          path: /tmp/manifest/digest
          if-no-files-found: error
          retention-days: 1

  esp-matter-build:
    runs-on: ${{ matrix.runner }}
    # Was 360, against a measured 337 on the QEMU leg - a 23-minute margin on a
    # figure that had grown 36 minutes in eight months. A cap, not a target: it
    # bounds what a wedged job costs.
    #
    # Deliberately generous until arm64 is measured. The only native esp-matter
    # figure that exists is 24 min on amd64; arm64 has never run outside QEMU, so
    # its per-core performance on connectedhomeip is unknown. Getting this wrong
    # downward is expensive in an unobvious way: the arm64 leg is killed, the
    # manifest job is skipped with it, and the published tags stay on the previous
    # build while the amd64 image sits in GHCR as an unreferenced blob. Lower this
    # once two runs have reported real numbers.
    timeout-minutes: 180
    needs: esp-idf-manifest
    # Owner-only, as esp-idf-build; see the note there.
    if: github.repository_owner == 'jethome-iot'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ['idf-v5.4.1-matter-v1.4.2']
        platform: ['linux/amd64', 'linux/arm64']
        include:
          - version: 'idf-v5.4.1-matter-v1.4.2'
            jethome_idf_base_tag: 'v5.4.1'
            esp_matter_version: 'v1.4.2'
          # 8-core is chosen for disk, not cores: the connectedhomeip tree is
          # ~50 GB and these pools measured 372 GB (amd64) and 393 GB (arm64)
          # free under Docker, against 88 GB on 4-core.
          - platform: 'linux/amd64'
            runner: 'ubuntu-latest-8core'
          - platform: 'linux/arm64'
            runner: 'ubuntu-latest-8core-arm'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        if: github.ref_name == 'master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "platform_tag=${PLATFORM_TAG}" >> "$GITHUB_OUTPUT"

      # Named after the ESP-IDF version this image declares in its own tag, so the
      # base it builds on and the version it advertises cannot drift apart: bump
      # esp-idf without bumping the blocks below and this download fails outright
      # instead of publishing an idf-v<old> tag built on v<new>.
      - name: ⬇️ Resolve base image digest
        uses: actions/download-artifact@v8
        with:
          name: manifest-digest-${{ env.ESP_IDF_IMAGE_NAME }}-${{ matrix.jethome_idf_base_tag }}
          path: /tmp/base

      - name: 🏷️ Read base image digest
        id: base
        run: |
          set -euo pipefail
          digest=$(cat /tmp/base/digest)
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::base digest not usable: '${digest}'"; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: 🐳 Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/esp-matter
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_MATTER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_name == 'master' }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_IDF_IMAGE_NAME }}@${{ steps.base.outputs.digest }}
            ESP_MATTER_VERSION=${{ matrix.esp_matter_version }}

      - name: 📤 Export digest
        if: github.ref_name == 'master'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: ⬆️ Upload digest
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.ESP_MATTER_IMAGE_NAME }}-${{ matrix.version }}-${{ steps.tags.outputs.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  esp-matter-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: esp-matter-build
    if: github.repository_owner == 'jethome-iot' && github.ref_name == 'master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ['idf-v5.4.1-matter-v1.4.2']
        include:
          - version: 'idf-v5.4.1-matter-v1.4.2'
            jethome_idf_base_tag: 'v5.4.1'
            esp_matter_version: 'v1.4.2'
    steps:
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ env.ESP_MATTER_IMAGE_NAME }}-${{ matrix.version }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: 🐳 Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_MATTER_IMAGE_NAME }}
          VERSION: idf-${{ matrix.jethome_idf_base_tag }}-matter-${{ matrix.esp_matter_version }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          found=$(find . -type f | wc -l | tr -d ' ')
          if [ "${found}" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${found}"
            exit 1
          fi
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          SHA_SHORT="${GITHUB_SHA:0:7}"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${SHA_SHORT}" \
            -t "${IMAGE}:${VERSION}" \
            "${refs[@]}"
