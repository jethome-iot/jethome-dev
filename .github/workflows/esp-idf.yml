# ESP-IDF Docker Build Workflow
# Builds ESP-IDF development image with pytest, QEMU, and testing tools
#
# Build Strategy:
# - Main repo master: Build + Push to GHCR
# - Main repo dev/PR: Build only (validation)
# - workflow_dispatch: Build on any branch of the main repo, push only on master
# - Forks: nothing runs - the runner pools are not reachable there; use
#   ./scripts/build.sh instead
# - Multi-platform: Platform matrix builds linux/amd64 and linux/arm64 in parallel,
#   each on a runner of its own architecture (matrix.runner) - no QEMU
#
# ESP-Matter base: on master it is the exact esp-idf digest esp-idf-manifest just
# published, handed over as an artifact within this run. On a pull request that job
# does not run, so esp-matter builds on the last published idf-<version> tag
# instead - which validates its own layers, and is why a green check here does now
# mean ESP-Matter compiles. A PR editing both images checks each against the
# other's released version; the new combination is exercised on master.
# esp-matter-manifest stays master-only: publishing is.
name: 🐳 ESP-IDF Docker Image

on:
  push:
    branches: [master, dev]
    # Negations come last and are order-sensitive; `paths:` and `paths-ignore:`
    # cannot both be used for one event. Documentation-only commits used to
    # trigger a full rebuild and republish every tag - the docs-only merge that
    # started this series set off a 5.5-hour ESP-Matter leg.
    paths:
      - '.github/workflows/esp-idf.yml'
      - 'images/esp-idf/**'
      - 'images/esp-matter/**'
      - 'images/versions.json'
      - 'scripts/versions-matrix.sh'
      - 'scripts/check-versions.sh'
      - '!images/**/*.md'
  pull_request:
    branches: [master, dev]
    paths:
      - '.github/workflows/esp-idf.yml'
      - 'images/esp-idf/**'
      - 'images/esp-matter/**'
      - 'images/versions.json'
      - 'scripts/versions-matrix.sh'
      - 'scripts/check-versions.sh'
      - '!images/**/*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ESP_IDF_IMAGE_NAME: jethome-dev-esp-idf
  ESP_MATTER_IMAGE_NAME: jethome-dev-esp-matter
  # build-push-action v6+ uploads a build record as a workflow artifact by default.
  # This repository is public, so that archive - full build log and metadata - would
  # be downloadable by anyone off the run page, on every leg of every push. The
  # summary itself is kept: it reports what was built without opening the log, and
  # costs no storage.
  DOCKER_BUILD_RECORD_UPLOAD: false

# Superseded pull-request runs are cancelled - nothing has been published yet and
# they cost money. Pushes are deliberately NOT grouped together: the group key
# includes the commit, so each one gets its own group and none can cancel another.
#
# `cancel-in-progress: false` would not have given a queue. GitHub cancels a
# *pending* run in a group whenever a newer one arrives, regardless of that flag -
# so grouping master pushes by ref would silently drop the middle commit of any
# three that land inside one build window, and its sha-<commit> image, which the
# READMEs document as the way to pin an exact commit, would never exist.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Both matrices come from images/versions.json, so a version lives in one place
  # instead of the four matrix blocks that used to be edited together. The
  # consistency check runs first and fails the whole workflow: cheaper to stop here
  # than to publish a tag whose contents do not match its name.
  prepare:
    name: 🧮 Resolve matrices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'jethome-iot'
    permissions:
      contents: read
    outputs:
      esp_idf_build: ${{ steps.matrices.outputs.esp_idf_build }}
      esp_idf_manifest: ${{ steps.matrices.outputs.esp_idf_manifest }}
      esp_matter_build: ${{ steps.matrices.outputs.esp_matter_build }}
      esp_matter_manifest: ${{ steps.matrices.outputs.esp_matter_manifest }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ✅ Check version consistency
        run: ./scripts/check-versions.sh

      - name: 🧮 Generate matrices
        id: matrices
        run: |
          set -euo pipefail
          # Assigned first, echoed second: `echo "k=$(cmd)"` takes echo's exit
          # status, so a failing generator would write an empty matrix and leave
          # this step green - the error surfacing later as an opaque fromJSON
          # failure in another job.
          esp_idf_build=$(./scripts/versions-matrix.sh esp-idf build)
          esp_idf_manifest=$(./scripts/versions-matrix.sh esp-idf manifest)
          esp_matter_build=$(./scripts/versions-matrix.sh esp-matter build)
          esp_matter_manifest=$(./scripts/versions-matrix.sh esp-matter manifest)
          {
            echo "esp_idf_build=${esp_idf_build}"
            echo "esp_idf_manifest=${esp_idf_manifest}"
            echo "esp_matter_build=${esp_matter_build}"
            echo "esp_matter_manifest=${esp_matter_manifest}"
          } >> "$GITHUB_OUTPUT"

  esp-idf-build:
    name: esp-idf-build (${{ matrix.tag }}, ${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # Owner-only, with no workflow_dispatch escape hatch: the runner pools belong
    # to jethome-iot, a fork cannot resolve their labels, and an unresolvable
    # `runs-on` queues for 24 hours rather than failing. A fork that wants to build
    # these images runs ./scripts/build.sh.
    if: github.repository_owner == 'jethome-iot'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.esp_idf_build) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        if: github.ref_name == 'master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, with no tag of its own: a tag here would be a mutable
      # name that the manifest job below has to look up again later, and between
      # those two moments another run can overwrite it. The digest is the only
      # thing handed forward.
      - name: 🐳 Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/esp-idf
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_IDF_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_name == 'master' }}
          build-args: ${{ matrix.build_args }}

      # Matrix legs cannot each set a job output - they would overwrite one
      # another - so the digests travel as one empty file per leg, named after the
      # digest itself.
      - name: 📤 Export digest
        if: github.ref_name == 'master'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: ⬆️ Upload digest
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.ESP_IDF_IMAGE_NAME }}-${{ matrix.tag }}-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  esp-idf-manifest:
    name: esp-idf-manifest (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, esp-idf-build]
    if: github.repository_owner == 'jethome-iot' && github.ref_name == 'master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.esp_idf_manifest) }}
    steps:
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ env.ESP_IDF_IMAGE_NAME }}-${{ matrix.tag }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: 🐳 Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_IDF_IMAGE_NAME }}
          TAG: ${{ matrix.tag }}
          PRIMARY: ${{ matrix.primary }}
          EXPECTED_PLATFORMS: ${{ matrix.platform_count }}
        run: |
          # pipefail matters below: jq exits 0 on empty input, so without it a
          # failed `imagetools inspect` would yield an empty digest and a green step.
          set -euo pipefail
          cd /tmp/digests

          # One file per platform leg. Fewer means a leg failed while fail-fast
          # let the others through, and publishing a single-platform image under
          # the multi-arch tags is worse than failing here.
          found=$(find . -type f | wc -l | tr -d ' ')
          if [ "${found}" -ne "${EXPECTED_PLATFORMS}" ]; then
            echo "::error::expected ${EXPECTED_PLATFORMS} platform digests, found ${found}"
            exit 1
          fi

          # Every source is a digest this run produced, so nothing here can be
          # resolved to another run's image. Built as an array rather than an
          # unquoted expansion, so the refs survive as separate arguments without
          # relying on word splitting. The version tag goes last on purpose: GHCR
          # shows the last one as the package's primary tag.
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          # Only the primary variant moves latest and sha-<commit>; a second
          # variant publishes its version tag alone. Without that, two variants of
          # one image would race for latest and whichever manifest job finished
          # last would win. The version tag is last on purpose: GHCR shows the
          # last one as the package's primary tag.
          tags=()
          if [ "${PRIMARY}" = "true" ]; then
            SHA_SHORT="${GITHUB_SHA:0:7}"
            tags+=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          tags+=(-t "${IMAGE}:${TAG}")
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

          # Hand the manifest's own digest to esp-matter-build, so it builds FROM
          # the exact image this run published rather than whatever the tag points
          # at by the time it starts. It travels as an artifact rather than a job
          # output because this job has a matrix: a scalar output would be
          # overwritten by whichever leg finished last, silently pinning
          # esp-matter to an arbitrary ESP-IDF version once there is more than one.
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::manifest digest not resolved: '${digest}'"; exit 1 ;;
          esac
          mkdir -p /tmp/manifest
          printf '%s' "${digest}" > /tmp/manifest/digest
          echo "published ${IMAGE}:${TAG} as ${digest}"

      - name: ⬆️ Upload base image digest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-digest-${{ env.ESP_IDF_IMAGE_NAME }}-${{ matrix.tag }}
          path: /tmp/manifest/digest
          if-no-files-found: error
          retention-days: 1

  esp-matter-build:
    name: esp-matter-build (${{ matrix.tag }}, ${{ matrix.platform }})
    needs: [prepare, esp-idf-manifest]
    runs-on: ${{ matrix.runner }}
    # From images/versions.json. A cap on a wedged job, not a target: killing this
    # leg skips the manifest job with it and leaves the published tags on the
    # previous build while the other platform's image sits in GHCR unreferenced.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # esp-idf-manifest only runs on master, and `needs` on a skipped job would skip
    # this one too - which is why ESP-Matter went unvalidated on every pull request
    # while a green "🐳 ESP-IDF Docker Image" check implied otherwise. `!cancelled()`
    # lets it proceed when that job was skipped, and the explicit failure test keeps
    # it from building on a base whose publication actually failed.
    if: ${{ !cancelled() && github.repository_owner == 'jethome-iot' && needs.esp-idf-manifest.result != 'failure' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # The pool for each platform comes from images/versions.json. 8-core is
      # chosen for disk, not cores: the connectedhomeip tree is ~50 GB and those
      # pools measured 372 GB (amd64) and 393 GB (arm64) free under Docker,
      # against 88 GB on 4-core.
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.esp_matter_build) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to GitHub Container Registry
        if: github.ref_name == 'master'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On master the base is the digest this very run published, downloaded from an
      # artifact named after the ESP-IDF version this image declares in its own tag
      # - so the base it builds on and the version it advertises cannot drift
      # apart, and a half-done bump fails here instead of publishing an idf-v<old>
      # tag built on v<new>.
      - name: ⬇️ Resolve base image digest
        if: github.ref_name == 'master'
        uses: actions/download-artifact@v8
        with:
          name: manifest-digest-${{ env.ESP_IDF_IMAGE_NAME }}-${{ matrix.base_tag }}
          path: /tmp/base

      - name: 🏷️ Resolve base image reference
        id: base
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_IDF_IMAGE_NAME }}
          BASE_TAG: ${{ matrix.base_tag }}
        run: |
          set -euo pipefail
          if [ -f /tmp/base/digest ]; then
            digest=$(cat /tmp/base/digest)
            case "${digest}" in
              sha256:*) ;;
              *) echo "::error::base digest not usable: '${digest}'"; exit 1 ;;
            esac
            ref="${IMAGE}@${digest}"
          else
            # No artifact: this is a pull request, where esp-idf-manifest does not
            # run and nothing has been published. Validating against the last
            # published base is the point - it checks this image's own layers,
            # which is what the change under review touches. A PR that also edits
            # esp-idf is checked against that image's *previous* release; the
            # combination is only exercised once both land on master.
            ref="${IMAGE}:${BASE_TAG}"
            echo "::notice::no digest artifact (not a master run) - validating against the published ${BASE_TAG}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "base image: ${ref}"

      - name: 🐳 Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/esp-matter
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_MATTER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_name == 'master' }}
          build-args: |
            ${{ matrix.base_arg }}=${{ steps.base.outputs.ref }}
            ${{ matrix.build_args }}

      - name: 📤 Export digest
        if: github.ref_name == 'master'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: ⬆️ Upload digest
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.ESP_MATTER_IMAGE_NAME }}-${{ matrix.tag }}-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  esp-matter-manifest:
    name: esp-matter-manifest (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, esp-matter-build]
    if: github.repository_owner == 'jethome-iot' && github.ref_name == 'master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.esp_matter_manifest) }}
    steps:
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ env.ESP_MATTER_IMAGE_NAME }}-${{ matrix.tag }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: 🐳 Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ESP_MATTER_IMAGE_NAME }}
          TAG: ${{ matrix.tag }}
          PRIMARY: ${{ matrix.primary }}
          EXPECTED_PLATFORMS: ${{ matrix.platform_count }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          found=$(find . -type f | wc -l | tr -d ' ')
          if [ "${found}" -ne "${EXPECTED_PLATFORMS}" ]; then
            echo "::error::expected ${EXPECTED_PLATFORMS} platform digests, found ${found}"
            exit 1
          fi
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          # Only the primary variant moves latest and sha-<commit>.
          tags=()
          if [ "${PRIMARY}" = "true" ]; then
            SHA_SHORT="${GITHUB_SHA:0:7}"
            tags+=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          tags+=(-t "${IMAGE}:${TAG}")
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
