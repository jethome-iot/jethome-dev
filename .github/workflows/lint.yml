# Lint
#
# Static checks for everything in this repository that something later executes:
# workflow files, shell scripts and Dockerfiles. It builds no image and needs no
# registry access.
#
# actionlint and shellcheck are gates. actionlint catches the failure modes this
# repository has actually hit - a `runs-on` label that matches no runner pool (see
# .github/actionlint.yaml), a `needs:` pointing at a renamed job, an expression
# that never evaluates - plus shellcheck over every `run:` block. shellcheck runs
# at `--severity=error` over the tracked `*.sh` files, so it fails on real bugs
# (an array spliced into a string, an unquoted expansion that splits) and stays
# quiet about style.
#
# hadolint is advisory: `--no-fail` plus `continue-on-error`, because these
# Dockerfiles break some of its rules deliberately - pinned apt versions would
# fight the version bumps CI drives through build args, and it reports `source` as
# undefined without seeing that the ESP images set `SHELL ["/bin/bash", "-c"]`.
# Read its output, do not obey it blindly. `continue-on-error` is what keeps that
# promise honest: without it a failed image pull - a Docker Hub rate limit, say -
# would turn the gate red on behalf of the one check documented as unable to.
#
# Run `./scripts/lint.sh` to get the same three checks locally.
name: 🧹 Lint

on:
  push:
    branches: [master, dev]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'images/*/Dockerfile'
      - '**/*.sh'
  pull_request:
    branches: [master, dev]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'images/*/Dockerfile'
      - '**/*.sh'
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: 🧹 Workflows, scripts and Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔎 Lint workflow files
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo \
            rhysd/actionlint:1.7.12 -color

      # The linter binary ships inside the actionlint image, so no second tool is
      # pulled here. (A comment starting with the tool's name inside a `run:`
      # block would be read as a shellcheck directive - hence this one sits
      # outside the script.)
      - name: 🐚 Lint shell scripts
        run: |
          git ls-files '*.sh' | tee /dev/stderr | xargs -r \
            docker run --rm -i -v "${PWD}:/repo" -w /repo \
              --entrypoint shellcheck rhysd/actionlint:1.7.12 --severity=error

      - name: 🐳 Lint Dockerfiles
        continue-on-error: true
        run: |
          for dockerfile in images/*/Dockerfile; do
            echo "::group::${dockerfile}"
            docker run --rm -i hadolint/hadolint:v2.15.1-alpine \
              hadolint --no-fail - < "${dockerfile}"
            echo "::endgroup::"
          done
